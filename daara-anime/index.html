<title>Fallou et Diarra à la Daara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one cartoon stage (16:9, 3:4 on phones) with a classroom board in the middle,
   the two children on either side, controls and chapters underneath. */
:root{
  --bg:#f6efe2; --fg:#2a2118; --muted:#6e604f; --panel:#fffaf1; --line:#e3d4bb;
  --accent:#1f7a53; --accent-fg:#ffffff; --chip:#efe3cd;
  --boy:#1f7a53; --girl:#8e3b6e;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --fg:#f3eadb; --muted:#b5a68f; --panel:#221c16; --line:#3b3127;
  --accent:#3fae7d; --accent-fg:#0e1a14; --chip:#2c241c; --boy:#5fc89a; --girl:#e08cc0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --fg:#f3eadb; --muted:#b5a68f; --panel:#221c16; --line:#3b3127;
  --accent:#3fae7d; --accent-fg:#0e1a14; --chip:#2c241c; --boy:#5fc89a; --girl:#e08cc0; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.1;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}

/* ---------- STAGE (illustration: fixed colours, independent of theme) ---------- */
.stage{position:relative;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;
  border-radius:18px;background:#efd9ae;box-shadow:0 10px 30px rgba(40,25,10,.18);--u:1cqw;user-select:none}
.wall{position:absolute;inset:0 0 26% 0;background:linear-gradient(#f5e4c0,#ead19f)}
.frieze{position:absolute;left:0;right:0;top:0;height:2.6cqw;
  background:repeating-linear-gradient(45deg,#1f7a53 0 1cqw,#f5e4c0 1cqw 1.3cqw,#d9a441 1.3cqw 2.3cqw,#f5e4c0 2.3cqw 2.6cqw);opacity:.9}
.floor{position:absolute;left:0;right:0;bottom:0;height:26%;
  background:repeating-linear-gradient(90deg,#a8323a 0 7cqw,#d9a441 7cqw 7.5cqw,#8f2831 7.5cqw 8cqw,#a8323a 8cqw 15cqw);}
.floor::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,0) 40%)}
.win{position:absolute;top:9%;width:12%;height:36%;border-radius:50% 50% 0 0/28% 28% 0 0;overflow:hidden;
  border:.6cqw solid #8a5a33;background:#8a5a33}
.win svg{width:100%;height:100%;display:block}
.win.l{left:6%}.win.r{right:6%}
.sky-top{transition:stop-color .8s}
.ribbon{position:absolute;left:50%;transform:translateX(-50%);top:3.2%;z-index:3;white-space:nowrap;
  font-family:var(--display);font-weight:800;font-size:1.5cqw;color:#fff;background:#1f7a53;
  padding:.2cqw 1.6cqw;border-radius:2cqw;box-shadow:0 .3cqw 0 #155a3d}

.board{position:absolute;left:26%;right:26%;top:10%;bottom:29%;z-index:2;
  background:#2c4a3b;border:.9cqw solid #8a5a33;border-radius:1.2cqw;
  box-shadow:inset 0 0 3cqw rgba(0,0,0,.35),0 .6cqw 0 #6c4426;
  color:#f4f1e6;font-family:var(--body);padding:1.4cqw 1.6cqw;display:flex;flex-direction:column;gap:calc(var(--u)*1);
  justify-content:center;overflow:hidden}
.board.swap{animation:boardIn .5s ease}
@keyframes boardIn{from{transform:translateY(-4%) scale(.97);opacity:.3}to{transform:none;opacity:1}}
.b-title{font-family:var(--display);font-weight:800;color:#ffe08a;font-size:calc(var(--u)*2.5);line-height:1.05;text-align:center;margin:0}
.b-sub{text-align:center;font-size:calc(var(--u)*1.45);opacity:.9;margin:0}
.b-ar{font-family:"Amiri","Traditional Arabic","Scheherazade New",serif;font-size:calc(var(--u)*3.2);text-align:center;color:#fff;line-height:1.2;margin:0}
.b-grid{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:calc(var(--u)*.9)}
.b-card{border:.18cqw dashed rgba(255,255,255,.55);border-radius:calc(var(--u)*1);padding:calc(var(--u)*.7);text-align:center;
  font-size:calc(var(--u)*1.35);line-height:1.25;min-width:0}
.b-card b{display:block;font-family:var(--display);font-size:calc(var(--u)*2.2);color:#ffe08a;line-height:1.05}
.b-card.warn b{color:#ff9b8a}
.b-list{margin:0;padding:0;list-style:none;display:grid;gap:calc(var(--u)*.45);font-size:calc(var(--u)*1.4);line-height:1.25}
.b-list li{display:flex;gap:calc(var(--u)*.7);align-items:flex-start}
.b-list li::before{content:"";flex:none;width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);margin-top:calc(var(--u)*.2);
  border:.2cqw solid #ffe08a;border-radius:50%;background:radial-gradient(#ffe08a 35%,transparent 40%)}
.b-list.no li::before{border-color:#ff9b8a;background:linear-gradient(45deg,transparent 44%,#ff9b8a 44% 56%,transparent 56%)}
.cal{display:grid;grid-template-columns:repeat(8,1fr);gap:calc(var(--u)*.5)}
.cal span{aspect-ratio:1;border-radius:calc(var(--u)*.5);background:rgba(255,255,255,.14);display:grid;place-items:center;
  font-family:var(--display);font-size:calc(var(--u)*1.5)}
.cal .late{background:#d9a441;color:#2c2010}.cal .stop{background:#d4553f;color:#fff}
.icon{width:calc(var(--u)*6);height:auto;display:block;margin:0 auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:calc(var(--u)*.6)}
.steps div{background:rgba(255,255,255,.12);border-top:.4cqw solid #ffe08a;border-radius:calc(var(--u)*.6) calc(var(--u)*.6) 0 0;
  padding:calc(var(--u)*.6);text-align:center;font-size:calc(var(--u)*1.3);line-height:1.2}
.steps div:nth-child(2){border-color:#ffb36b}.steps div:nth-child(3){border-color:#ff7d6b}
.steps b{display:block;font-family:var(--display);font-size:calc(var(--u)*2.6);line-height:1}

/* characters */
.char{position:absolute;bottom:3%;width:18%;z-index:4}
.char svg{width:100%;height:auto;display:block;overflow:visible}
.char.boy{left:5%}.char.girl{right:5%}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.girl .bob{animation-delay:-1.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2%)}}
.eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.girl .eyes{animation-delay:-2.1s}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mouth-open{display:none}
.talking .mouth-closed{display:none}
.talking .mouth-open{display:inline;animation:talk .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center top}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.05)}}
.gesture{transform-box:fill-box;transform-origin:50% 6%}
.talking .gesture{animation:wave 1.1s ease-in-out infinite}
.boy .gesture{--a:-14deg}.girl .gesture{--a:14deg}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(var(--a))}}
.talking .bob{animation-duration:1.4s}
.emote{position:absolute;left:50%;top:-9%;transform:translateX(-50%) scale(0);font-family:var(--display);font-weight:800;
  font-size:4.2cqw;line-height:1;color:#d4553f;text-shadow:0 .3cqw 0 #fff;transition:transform .25s cubic-bezier(.3,1.8,.6,1)}
.emote.on{transform:translateX(-50%) scale(1)}

/* speech bubble */
.bubble{position:absolute;bottom:57%;width:24%;z-index:5;background:#fff;color:#2a2118;border-radius:1.6cqw;
  padding:1cqw 1.2cqw 1.1cqw;font-size:1.5cqw;line-height:1.32;box-shadow:0 .5cqw 0 rgba(0,0,0,.12);border:.25cqw solid #2a2118;
  transform-origin:var(--ox,20%) 110%;transition:transform .2s ease,opacity .2s ease}
.bubble.hide{opacity:0;transform:scale(.6)}
.bubble.small{font-size:1.32cqw}
.bubble .who{display:block;font-family:var(--display);font-weight:800;font-size:1.35cqw;line-height:1.1;margin-bottom:.3cqw}
.bubble::after{content:"";position:absolute;bottom:-1.6cqw;left:var(--tail,28%);width:2cqw;height:2cqw;background:#fff;
  border-right:.25cqw solid #2a2118;border-bottom:.25cqw solid #2a2118;transform:skewX(var(--skew,20deg)) rotate(45deg)}
.bubble.F{left:1.5%;--ox:30%;--tail:40%;--skew:-10deg}.bubble.F .who{color:#1f7a53}
.bubble.D{right:1.5%;--ox:70%;--tail:55%;--skew:10deg}.bubble.D .who{color:#8e3b6e}
.bubble.B{left:30%;width:40%;bottom:6%;text-align:center;--ox:50%;--tail:46%}.bubble.B::after{display:none}
.bubble.B .who{color:#1f7a53}

.startbtn{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(30,20,10,.25);border:0;cursor:pointer;padding:0}
.startbtn[hidden]{display:none}
.startbtn span{font-family:var(--display);font-weight:800;font-size:2.4cqw;background:#1f7a53;color:#fff;border-radius:4cqw;
  padding:1cqw 3cqw;display:flex;align-items:center;gap:1cqw;box-shadow:0 .6cqw 0 #155a3d}
.startbtn svg{width:2.2cqw;height:2.2cqw}
.startbtn:focus-visible span{outline:3px solid #ffe08a;outline-offset:3px}

/* subtitle (phones) */
.subtitle{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:5.6em}
.subtitle .who{font-family:var(--display);font-weight:800;display:block;line-height:1.1;margin-bottom:2px}
.subtitle.F .who,.subtitle.B .who{color:var(--boy)}.subtitle.D .who{color:var(--girl)}

/* controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{font:inherit;font-weight:800;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;
  padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:42px}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;padding-inline:20px}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[aria-pressed="false"]{opacity:.7}
.progress{flex:1 1 160px;min-width:0;height:8px;border-radius:8px;background:var(--chip);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}

.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:0;padding:0;list-style:none}
.chip{width:100%;text-align:left;font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  border-radius:12px;padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.chip small{font-family:var(--display);font-weight:800;color:var(--muted);min-width:3.2em;font-size:.8rem;letter-spacing:.03em}
.chip[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.chip[aria-current="true"] small{color:inherit;opacity:.85}
.note{color:var(--muted);font-size:.85rem;margin:0}

@media (max-width:640px){
  .stage{aspect-ratio:3/4;--u:2.05cqw}
  .win,.frieze{display:none}
  .wall{inset:0 0 22% 0}.floor{height:22%}
  .ribbon{font-size:3.2cqw;top:2%;padding:.4cqw 3cqw}
  .board{left:4%;right:4%;top:8%;bottom:44%;padding:3cqw}
  .char{width:30%;bottom:2%}.char.boy{left:6%}.char.girl{right:6%}
  .emote{font-size:8cqw}
  .bubble{display:none}
  .subtitle{display:block}
  .startbtn span{font-size:5cqw;padding:2cqw 6cqw;gap:2cqw}.startbtn svg{width:4.5cqw;height:4.5cqw}
}
@media (prefers-reduced-motion:reduce){
  .bob,.eyes,.talking .gesture,.talking .mouth-open,.board.swap{animation:none}
}
</style>

<script>
(function(){
const windowSvg = sky => `<svg viewBox="0 0 100 160" preserveAspectRatio="xMidYMax slice">

const $ = id => document.getElementById(id);
const stage=$('stage'), board=$('board'), ribbon=$('ribbon'), bubble=$('bubble'), btext=$('btext'), bwho=$('bwho'),
      sub=$('subtitle'), stext=$('stext'), swho=$('swho'), boy=$('boy'), girl=$('girl'), bar=$('bar'), count=$('count');
const NAMES={F:'Fallou',D:'Diarra',B:'Fallou et Diarra'};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const total = scenes.reduce((n,s)=>n+s.lines.length,0);
const tts = 'speechSynthesis' in window ? window.speechSynthesis : null;
let S=0, L=0, shownScene=-1, playing=false, voiceOn=!!tts, token=0;

stage.querySelector('.win.l').innerHTML = windowSvg('morning');
stage.querySelector('.win.r').innerHTML = windowSvg('morning');

// chapters
const chList=$('chapters');
scenes.forEach((s,i)=>{
  const li=document.createElement('li');
  li.innerHTML=`<button class="chip" type="button" id="ch${i}"><small>${s.tag}</small><span>${s.short}</span></button>`;
  li.firstChild.addEventListener('click',()=>{S=i;L=0;show();});
  chList.appendChild(li);
});

let frVoice=null;
function pickVoice(){ if(!tts) return; const v=tts.getVoices().filter(v=>/^fr/i.test(v.lang)); frVoice=v.find(x=>/fr-FR/i.test(x.lang))||v[0]||null; }
if(tts){ pickVoice(); tts.onvoiceschanged=pickVoice; }

function renderScene(){
  const s=scenes[S];
  ribbon.textContent = s.tag==='Intro' ? 'Bienvenue à la Daara' : `${s.tag} · ${s.short}`;
  board.innerHTML=s.board;
  board.classList.remove('swap'); void board.offsetWidth; board.classList.add('swap');
  stage.querySelectorAll('.win').forEach(w=>w.innerHTML=windowSvg(s.sky));
  scenes.forEach((_,i)=>$('ch'+i).setAttribute('aria-current', i===S?'true':'false'));
  shownScene=S;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
// Recorded voices: audio/s{scene}-{line}.mp3 (both children: -F and -D files played together).
let current=[];
function stopAudio(){ current.forEach(a=>{a.pause();a.src='';}); current=[]; }
function playFile(src){
  return new Promise((res,rej)=>{
    const a=new Audio(src); current.push(a);
    a.onended=()=>res(true); a.onerror=()=>rej(new Error('missing'));
    a.play().catch(rej);
  });
}
async function speak(text,who){
  if(!voiceOn) return false;
  stopAudio();
  const base=`audio/s${S}-${L}`;
  try{
    if(who==='B') await Promise.all([playFile(base+'-F.mp3'),playFile(base+'-D.mp3')]);
    else await playFile(base+'.mp3');
    return true;
  }catch(e){ stopAudio(); return speakSynth(text,who); }
}
function speakSynth(text,who){
  return new Promise(res=>{
    if(!voiceOn||!tts){ return res(false); }
    tts.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/Jërëjëf/g,'Diéré-diéf').replace(/Xam Xam/g,'Ram Ram'));
    u.lang='fr-FR'; if(frVoice) u.voice=frVoice;
    u.pitch = who==='D'?1.6:who==='F'?1.25:1.4; u.rate=0.98;
    let done=false; const fin=()=>{ if(!done){done=true;res(true);} };
    u.onend=fin; u.onerror=fin;
    setTimeout(fin, text.length*95+5000);
    tts.speak(u);
  });
}
function setTalking(who,on){
  boy.classList.toggle('talking', on && (who==='F'||who==='B'));
  girl.classList.toggle('talking', on && (who==='D'||who==='B'));
}
function setEmote(who,e){
  $('emoteF').textContent = who==='F'&&e?e:''; $('emoteF').classList.toggle('on', !!(who==='F'&&e));
  $('emoteD').textContent = who==='D'&&e?e:''; $('emoteD').classList.toggle('on', !!(who==='D'&&e));
}
function updateProgress(){
  let n=0; for(let i=0;i<S;i++) n+=scenes[i].lines.length; n+=L+1;
  bar.style.width=(n/total*100)+'%'; count.textContent=`${n} / ${total}`;
}

async function show(opts={}){
  const my=++token;
  if(tts) tts.cancel(); stopAudio();
  if(shownScene!==S) renderScene();
  const [who,text,emote]=scenes[S].lines[L];
  updateProgress();
  bubble.className='bubble hide '+who+(text.length>150?' small':'');
  sub.className='subtitle '+who;
  bwho.textContent=swho.textContent=NAMES[who];
  setEmote(who,emote);
  if(opts.still){ btext.textContent=stext.textContent=text; bubble.classList.remove('hide'); return; }
  await wait(60); if(my!==token) return;
  bubble.classList.remove('hide');
  setTalking(who,true);
  const spoken=speak(text,who);
  if(reduce){ btext.textContent=stext.textContent=text; }
  else{
    for(let i=1;i<=text.length;i++){
      if(my!==token) return;
      btext.textContent=stext.textContent=text.slice(0,i);
      await wait(30);
    }
  }
  const usedVoice=await spoken; if(my!==token) return;
  setTalking(who,false);
  if(!usedVoice) await wait(900+text.length*40);
  else await wait(500);
  if(my!==token||!playing) return;
  advance();
}
function advance(){
  if(L<scenes[S].lines.length-1){L++;}
  else if(S<scenes.length-1){S++;L=0;}
  else { setPlaying(false); return; }
  show();
}
function back(){
  if(L>0){L--;} else if(S>0){S--;L=scenes[S].lines.length-1;} show();
}
function setPlaying(p){
  playing=p;
  $('playLabel').textContent=p?'Pause':(S===scenes.length-1&&L===scenes[S].lines.length-1?'Revoir':'Lecture');
  $('playIcon').innerHTML=p?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';
  if(!p){ token++; if(tts) tts.cancel(); stopAudio(); setTalking('',false); }
}
function play(){
  $('start').hidden=true;
  if(!playing && S===scenes.length-1 && L===scenes[S].lines.length-1){S=0;L=0;}
  setPlaying(true); show();
}
$('start').addEventListener('click',play);
$('play').addEventListener('click',()=> playing?setPlaying(false):play());
$('next').addEventListener('click',()=>{ $('start').hidden=true; advance(); });
$('prev').addEventListener('click',()=>{ $('start').hidden=true; back(); });
$('voice').addEventListener('click',e=>{ voiceOn=!voiceOn; e.currentTarget.setAttribute('aria-pressed',voiceOn); if(!voiceOn){ if(tts) tts.cancel(); stopAudio(); } });
document.addEventListener('keydown',e=>{
  if(e.target.closest('button')&&e.key===' ') return;
  if(e.key==='ArrowRight'){ $('start').hidden=true; advance(); }
  else if(e.key==='ArrowLeft'){ $('start').hidden=true; back(); }
});

show({still:true});
})();
</script>
